## 2) ОПИСАНИЕ MR (написано автором)

{{ mr_description }}

## 3) СПИСОК КОММИТОВ (сводка)

{{ commits_summary }}

## 4) КОММИТЫ С ПОЛНЫМ ТЕЛОМ И ИХ DIFF (каждый коммит отдельно)

Разбирайся в каждом коммите — используй эти данные для смысловой группировки изменений в «Основные направления».

